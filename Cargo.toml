[workspace]
resolver = "2"
members = ["core", "engine", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Seyroo (vDaiki-dev)"]
repository = "https://github.com/vDaiki-dev/Seyro-MP4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
