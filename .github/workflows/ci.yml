name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: Núcleo · fmt, clippy y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Formato
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p seyro-mp4-core --all-targets -- -D warnings
      - name: Pruebas deterministas
        run: cargo test -p seyro-mp4-core

  engine:
    name: Motor · clippy y pruebas deterministas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.100.0'
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Clippy
        run: cargo clippy -p seyro-mp4-engine --all-targets -- -D warnings
      - name: Pruebas del motor
        run: cargo test -p seyro-mp4-engine

  desktop:
    name: Tauri · compilación e iconos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev librsvg2-bin imagemagick
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.100.0'
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Iconos derivados del SVG maestro
        run: |
          bash scripts/build-icons.sh
          python3 - <<'PY'
          import pathlib
          out = pathlib.Path('src-tauri/icons')
          expected = {
              '32x32.png': b'\x89PNG\r\n\x1a\n',
              '128x128.png': b'\x89PNG\r\n\x1a\n',
              '128x128@2x.png': b'\x89PNG\r\n\x1a\n',
              'icon.png': b'\x89PNG\r\n\x1a\n',
              'icon.icns': b'icns',
              'icon.ico': b'\x00\x00\x01\x00',
          }
          for name, magic in expected.items():
              data = (out / name).read_bytes()
              assert data.startswith(magic), name
          print('OK: 6 iconos con cabeceras válidas')
          PY
      - name: Comprobar la capa Tauri
        run: cargo check -p seyro-mp4-app

  frontend:
    name: Frontend · pruebas, i18n y assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Comprobar entorno Node del runner
        run: node --version
      - name: Higiene, pruebas y paridad de idiomas
        run: bash scripts/check-frontend.sh

  hygiene:
    name: Higiene · secretos y documentación legal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Buscar secretos en archivos versionados
        run: bash scripts/check-secrets.sh
      - name: Verificar documentos obligatorios
        run: |
          for file in README.md LICENSE SECURITY.md CONTRIBUTING.md \
            docs/ARCHITECTURE.md docs/DESIGN.md docs/FORMATOS.md \
            docs/PRIVACIDAD.md docs/TERMINOS.md docs/COOKIES.md \
            docs/DESCARGO.md docs/index.html docs/.nojekyll; do
            test -f "$file" || { echo "Falta $file" >&2; exit 1; }
          done
          echo 'OK: documentación legal presente'
      - name: Sin dependencias remotas en la web estática
        run: |
          if grep -RInE '(cdn\.|unpkg\.com|jsdelivr\.net|fonts\.googleapis\.com)' docs --include='*.html'; then
            echo 'ERROR: referencia remota en docs/' >&2
            exit 1
          fi
          echo 'OK: documentación autocontenida'
